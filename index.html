html,body{margin:0;height:100%;background:#2a0c10;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;display:block;touch-action:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 40%,#8b0f1a,#2a0c10 75%);color:#f8e7c0;font:24px MaShan,Trad,serif;text-align:center;z-index:30;touch-action:none;padding:24px;box-sizing:border-box}
#rot .ph{width:62px;height:104px;border:5px solid #f2b632;border-radius:12px;position:relative;animation:rt 2.2s ease-in-out infinite}
#rot .ph:after{content:'';position:absolute;left:50%;bottom:6px;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#f2b632}
#rot small{font:15px ZCOOL,Trad,sans-serif;opacity:.85;line-height:1.6}
@keyframes rt{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
.pause-button{position:fixed;z-index:10;left:8px;top:4px;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;gap:5px;border:2px solid #f2b632;border-radius:50%;background:#a3201a;box-shadow:0 2px 5px #0006;cursor:pointer;touch-action:none}
.pause-button span{display:block;width:4px;height:13px;border-radius:1px;background:#f8e7c0}
.pause-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#1a0406b8;padding:12px;touch-action:none}
.pause-backdrop[hidden]{display:none}
.pause-card{box-sizing:border-box;width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;display:grid;grid-template-columns:200px 1fr;gap:6px 18px;padding:16px 18px;background:#f7e9c6;border:3px solid #a3201a;border-radius:10px;outline:1.5px solid #d7a33a;outline-offset:-8px;box-shadow:0 8px 28px #000a;color:#3a160c;font:15px ZCOOL,Trad,sans-serif}
.pause-card h2{grid-column:1/-1;margin:0 0 4px;font:normal 28px MaShan,Trad,serif;color:#7a1010;text-align:center;letter-spacing:4px}
.pause-col{display:flex;flex-direction:column;gap:8px}
.pause-card p{margin:4px 0 0;color:#7a1010;font:16px MaShan,Trad,serif}
.pause-card button{min-height:44px;border:1.5px solid #8a5a2a;border-radius:8px;background:#fff6dc;color:#3a160c;padding:6px 10px;font:15px ZCOOL,Trad,sans-serif;cursor:pointer;touch-action:none}
.pause-card button[aria-pressed="true"]{border:2.5px solid #a3201a;background:#ffe39a}
.pause-card .pause-resume{min-height:52px;font:22px MaShan,Trad,serif;background:#a3201a;color:#ffe7a0;border-color:#f2b632}
.pause-help{margin:0;padding-left:18px;font-size:14px;line-height:1.55}
.pause-help li{margin-bottom:4px}
@media (max-height:340px){.pause-card{gap:4px 14px;padding:10px 14px}.pause-card h2{font-size:22px}.pause-help{font-size:13px;line-height:1.4}}
